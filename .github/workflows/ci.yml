name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check src tests feast_repo
      - name: Warehouse, features, forecast and pages
        run: python -m jrr.pipeline
        env:
          JRR_ROOT: ${{ github.workspace }}
          JRR_DUCKDB: ${{ github.workspace }}/data/warehouse/jrr.duckdb
          PYTHONPATH: ${{ github.workspace }}/src
      - name: Tests
        run: pytest
        env:
          JRR_ROOT: ${{ github.workspace }}
          JRR_DUCKDB: ${{ github.workspace }}/data/warehouse/jrr.duckdb
          PYTHONPATH: ${{ github.workspace }}/src
      - name: Dagster asset graph loads
        run: python -c "from jrr.definitions import defs; assert len(list(defs.assets)) >= 6"
        env:
          PYTHONPATH: ${{ github.workspace }}/src

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Terraform
        run: |
          curl -fsSL -o /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
          unzip -q -o /tmp/terraform.zip -d /tmp/terraform-bin
          sudo mv /tmp/terraform-bin/terraform /usr/local/bin/terraform
          terraform version
      - name: Format and validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate
