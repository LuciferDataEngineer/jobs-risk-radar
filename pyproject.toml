[project]
name = "jobs-risk-radar"
version = "1.0.0"
description = "Regional unemployment early-warning radar for Australia."
requires-python = ">=3.11"
dependencies = [
  "pandas==2.3.3",
  "polars==2.1.0",
  "pyarrow==18.0.0",
  "numpy==1.26.4",
  "scikit-learn==1.5.2",
  "lightgbm==4.6.0",
  "mlflow==2.18.0",
  "feast==0.45.0",
  "ibis-framework[duckdb]==9.5.0",
  "evidently==0.4.40",
  "dagster==1.9.13",
  "dbt-core==1.8.10",
  "dbt-duckdb==1.9.6",
  "duckdb==1.1.3",
  "pyyaml==6.0.3",
  "jinja2==3.1.6",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.7.4"]
snapshot = ["openpyxl==3.1.5", "pyshp==2.3.1", "shapely==2.0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
